[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "http://www.sahibul.dev/*"
  to = "https://sahibul.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.sahibul.dev/*"
  to = "https://sahibul.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
