<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Sahibul NF</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --ink: #0b1c24;
        --ink-soft: #1a3340;
        --foam: #f5fafb;
        --mist: #e7f3f6;
        --cyan: #0a7082;
        --muted: #5a6f78;
        --line: rgb(11 28 36 / 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        font-family: 'Figtree', ui-sans-serif, system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(120% 80% at 10% 0%, #9fe7f0 0%, var(--mist) 38%, var(--foam) 68%, #efe4d4 100%);
      }

      main {
        display: grid;
        place-items: center;
        min-height: 100svh;
        padding: 2rem 1.25rem;
      }

      .card {
        width: min(100%, 34rem);
        padding: 2.5rem 2rem;
        border: 1px solid rgb(255 255 255 / 0.8);
        border-radius: 1.5rem;
        background: rgb(245 250 251 / 0.92);
        box-shadow: 0 24px 48px rgb(11 28 36 / 0.1);
        text-align: center;
      }

      .code {
        display: inline-block;
        margin: 0 0 1rem;
        font-family: 'Syne', ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(4rem, 18vw, 6.5rem);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.05em;
        color: var(--cyan);
      }

      h1 {
        margin: 0;
        font-family: 'Syne', ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(1.5rem, 4vw, 2rem);
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      p {
        margin: 1rem 0 0;
        font-size: 1.05rem;
        line-height: 1.6;
        color: var(--muted);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 2rem;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0.65rem 1.35rem;
        border-radius: 999px;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        transition: transform 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
      }

      a:hover {
        transform: translateY(-1px);
      }

      .primary {
        color: var(--foam);
        background: var(--cyan);
        box-shadow: 0 10px 30px rgb(10 112 130 / 0.28);
      }

      .secondary {
        color: var(--ink-soft);
        border: 1px solid var(--line);
        background: white;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <p class="code" aria-hidden="true">404</p>
        <h1>This page doesn’t exist</h1>
        <p>
          The URL may be outdated or mistyped. Head back to the portfolio to explore projects,
          experience, and contact options.
        </p>
        <div class="actions">
          <a class="primary" href="/">Back to portfolio</a>
          <a class="secondary" href="/#contact">Contact me</a>
        </div>
      </div>
    </main>
  </body>
</html>
